<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BILLA Gutschein Loop</title>
<style>
:root{--bg:#f4f1ea;--ink:#670003;--font:"Satoshi",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:var(--font)}
#vp{position:absolute;overflow:hidden;background:var(--bg)}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:var(--bg)}
.card{position:absolute;background:#fff;overflow:hidden}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
#ui{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;justify-content:center;align-items:center;padding:16px;background:linear-gradient(transparent,rgba(0,0,0,.5));opacity:0;transition:opacity .25s}
body:hover #ui,body.paused #ui{opacity:1}
#ui button,#ui a{appearance:none;border:0;border-radius:999px;height:44px;padding:0 20px;background:#fff;color:#1d1d1b;font:700 15px/44px var(--font);text-decoration:none;cursor:pointer}
#ui button:focus-visible,#ui a:focus-visible{outline:3px solid #ee2a06;outline-offset:2px}
body.render #ui{display:none}
</style>
</head>
<body>
<div id="vp"><div id="stage">
 <div id="wall" style="position:absolute;inset:0"><div id="wg" style="position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0"></div></div>
 <div id="phoneL" style="position:absolute;inset:0;background:var(--bg)"><div id="phone" style="position:absolute;transform-origin:0 0"></div></div>
</div></div>
<div id="ui"><button id="play" type="button">Pausieren</button></div>
<script>
/* BILLA-Gutschein-Loop: 8 Takte = 32 Schläge. Handy (BILLA oben) → Liste scrollt langsam →
   Überblendung in die Angebotswand → Wand läuft, fährt auf die BILLA-Karte → Überblendung zurück ins Handy (= Bild 1). */
const IMG=__IMGS__;
const LEN=18.25,B=LEN/32,FPS=24;          // 8 Takte im Tempo des Partnerfilms, ohne Musik
const $=id=>document.getElementById(id);
const clamp=v=>Math.max(0,Math.min(1,v)),seg=(t,a,b)=>clamp((t-a)/(b-a));
const eIO=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2,eOut=p=>1-Math.pow(1-p,3);

// --- Handy (wie im Partnerfilm: Gutscheine-Screen der jö App)
const K=960/866,PW=420*K,PH=960,PL=(1920-PW)/2,PT=60,IN=18*K,SW=PW-2*IN,PAD=18,CW=SW-2*PAD,GAP=16,Y0=175,AR=854/814;
const LIST=['billa','penny','adeg','omv','pearle','universal','bipa_bonusbox','sutterluety','zgonc','forstinger'];
const MI=6;                                // diese Karte landet beim Match-Cut auf derselben Karte in der Wand
const IH=CW/AR,IY=LIST.map((_,i)=>Y0+i*(IH+GAP));
$('phone').style.cssText+=`left:${PL}px;top:${PT}px;width:${PW}px;height:${PH}px`;
$('phone').innerHTML=`<div style="position:absolute;inset:0;border-radius:${70*K}px;background:linear-gradient(135deg,#d9dde2,#8a9098 40%,#cfd3d8 60%,#6d737b);box-shadow:0 40px 80px rgba(60,10,20,.28)"></div>
 <div style="position:absolute;inset:${6*K}px;border-radius:${64*K}px;background:#111"></div>
 <div style="position:absolute;inset:${IN}px;border-radius:${54*K}px;overflow:hidden;background:#f4f1ea">
  <div id="list" style="position:absolute;inset:0">${LIST.map((n,i)=>`<div class="card" style="left:${PAD}px;top:${IY[i]}px;width:${CW}px;height:${IH}px;border-radius:11px;box-shadow:0 8px 22px rgba(60,20,30,.10)"><img src="${IMG[n]}" alt=""></div>`).join('')}</div>
  <div style="position:absolute;left:0;right:0;top:0;height:${Y0-8}px;background:#f4f1ea"></div>
  <div style="position:absolute;left:30px;top:20px;color:#1d1d1b;font-size:17px;font-weight:700">12:30</div>
  <div style="position:absolute;left:${PAD}px;top:62px;color:var(--ink);font-size:36px;font-weight:800;letter-spacing:-.01em">Gutscheine</div>
  <div style="position:absolute;left:${PAD}px;top:118px;display:flex;gap:10px">${['Alle','Favoriten','Aktiviert'].map((l,i)=>`<div style="height:38px;padding:0 18px;border-radius:19px;display:flex;align-items:center;font-size:17px;font-weight:700;${i?'background:#fff;color:var(--ink)':'background:var(--ink);color:#fff'}">${l}</div>`).join('')}</div>
 </div>
 <div style="position:absolute;left:50%;top:${30*K}px;width:${108*K}px;height:${30*K}px;margin-left:-${54*K}px;border-radius:${15*K}px;background:#111"></div>`;
// Handy so verschieben/skalieren, dass Listeneintrag i bei Scroll scr auf dem Rechteck [x,y,Breite] liegt
const fit=(i,scr,T)=>{const S=T[2]/CW;return [T[0]-PL-S*(IN+PAD),T[1]-PT-S*(IN+IY[i]-scr),S]};

// --- Angebotswand (drei Spalten, außen nach unten, Mitte nach oben)
const CWW=854,CHW=814,GX=64,GY=64,WS=.66,SIDE=.5,CTR=2;
const COLS=[['sutterluety','forstinger','pearle','biogena','penny','adeg','omv','zgonc'],['zgonc','universal','bipa_bonusbox','omv','billa','adeg','penny','pearle'],['adeg','penny','universal','sutterluety','billa','zgonc','pearle','forstinger']];
$('wg').innerHTML=COLS.map((c,ci)=>`<div class="wcol" style="position:absolute;left:0;top:0">${c.map((n,ri)=>`<div class="card" style="left:${(ci-1)*(CWW+GX)-CWW/2}px;top:${(ri-CTR)*(CHW+GY)-CHW/2}px;width:${CWW}px;height:${CHW}px;border-radius:24px;box-shadow:0 30px 70px rgba(94,23,8,.12)"><img src="${IMG[n]}" alt=""></div>`).join('')}</div>`).join('');
const WC=[...document.querySelectorAll('.wcol')];
// Laufweg der Spalten (Wandeinheiten): setzt nach dem Schnitt sofort ein, bremst vor dem Heranfahren weich ab
const W0=8*B,WSTOP=25*B,WPUSH=25*B,WCUT=28.5*B;
const WSPD=2*(CHW+GY)*WS/(WSTOP-W0-B);          // px/s bei 66 %: die Mitte läuft genau 2 Karten weit, BILLA steht danach in der Bildmitte
const run=t=>{const a=t-W0,T=WSTOP-W0,r=2*B;return a<=0?0:a<T-r?a:(T-r)+r*.5-(r*.5)*Math.pow(1-clamp((a-(T-r))/r),2)};
const wallD=t=>WSPD*run(t)/WS;
// Rechteck (Bildschirm) einer Wandkarte bei Kamera scale s und Verschiebung (ox,oy)
const wRect=(ci,ri,t,s,ox,oy)=>{const d=wallD(t),dir=ci===1?-1:1,off=ci===1?0:-SIDE*(CHW+GY),y=(ri-CTR)*(CHW+GY)-CHW/2+dir*d+off,x=(ci-1)*(CWW+GX)-CWW/2;return [960+ox+s*x,540+oy+s*y,s*CWW]};
const MATCH_A=wRect(1,2,W0,WS,0,0);         // Bonusbox in der Mitte der Wand beim ersten Schnitt
const XA0=6.5*B,XF0=25.5*B,ZEND=29.5*B;    // Überblendungen Handy → Wand ab XA0, Wand → Handy ab XF0; Handy steht ab ZEND wieder in der Ausgangslage
// Ausgangslage = ganzes Handy, BILLA oben in der Liste. Wand: BILLA (Mitte, Zeile 4) steht nach dem Abbremsen in der Bildmitte,
// die Kamera zieht leicht auf, bis die Karte so groß ist wie im Handy, und das Handy blendet deckungsgleich darüber – kein Hin-und-her-Zoom
const HOME=[PL+IN+PAD,PT+IN+Y0,CW];         // BILLA-Karte im Handy in der Ausgangslage
const outW=t=>{const p=eIO(seg(t,WPUSH,ZEND)),w0=CWW*WS,h0=w0/AR;return [960-w0/2+(HOME[0]-960+w0/2)*p,540-h0/2+(HOME[1]-540+h0/2)*p,w0+(CW-w0)*p]};
function frame(t){
 t=((t%LEN)+LEN)%LEN;const u=t/B;
 const wallOn=t>=XA0&&t<WCUT,phoneOn=t<W0||t>=XF0;
 $('wall').style.display=wallOn?'':'none';$('phoneL').style.display=phoneOn?'':'none';
 $('phoneL').style.opacity=t>=XA0&&t<W0?(1-eIO(seg(t,XA0,W0))).toFixed(3):t>=XF0&&t<WCUT?eIO(seg(t,XF0,WCUT)).toFixed(3):'1';
 let A=null,scr=0;
 if(phoneOn){
  if(u<8||u>=30.5){ // Liste scrollt langsam von BILLA bis zur Bonusbox, dann fährt das Handy heran (Bonusbox → Bonusbox der Wand)
   const uu=u>=30.5?u-32:u;scr=(IY[MI]-Y0)*eIO(seg(uu,-1.5,6));
   const m=eIO(seg(uu,5.5,8-1/FPS/B)),P2=fit(MI,scr,MATCH_A);A=[P2[0]*m,P2[1]*m,1+(P2[2]-1)*m];
  }else A=fit(0,0,outW(t));
  $('list').style.transform=`translateY(${(-scr).toFixed(2)}px)`;
  $('phone').style.transform=`translate(${A[0].toFixed(2)}px,${A[1].toFixed(2)}px) scale(${A[2].toFixed(5)})`;
 }
 if(wallOn){
  const d=wallD(t);let x,y,s;
  if(t<W0){const S=A[2];x=A[0]+PL+S*(IN+PAD);y=A[1]+PT+S*(IN+IY[MI]-scr);s=S*CW/CWW} // Bonusbox der Wand fährt deckungsgleich mit der im Handy
  else{const R=outW(t);x=R[0];y=R[1];s=R[2]/CWW}                                  // BILLA der Wand: von der Bildmitte zur Lage im Handy
  $('wg').style.transform=`translate(${(x+s*CWW/2).toFixed(2)}px,${(y+s*CHW/2).toFixed(2)}px) scale(${s.toFixed(5)})`;
  WC.forEach((c,i)=>{const dr=i===1?-1:1;c.style.transform=`translateY(${(dr*d+(i===1?0:-SIDE*(CHW+GY))).toFixed(2)}px)`});
 }
}
// --- Anzeige: Bühne 1920×1080 ins Fenster einpassen
const RENDER=new URLSearchParams(location.search).has('__render');
if(RENDER)document.body.classList.add('render');
function size(){const vp=$('vp');let w,h;if(RENDER){w=innerWidth;h=innerHeight}else{w=Math.min(innerWidth,innerHeight*16/9);h=w*9/16}
 vp.style.cssText=`left:${(innerWidth-w)/2}px;top:${(innerHeight-h)/2}px;width:${w}px;height:${h}px`;$('stage').style.transform=`scale(${w/1920})`}
addEventListener('resize',size);size();
// --- Wiedergabe: läuft sofort im Loop, Klick oder Leertaste pausiert
let t0=performance.now()/1000,playing=true,tPause=0;
const now=()=>playing?performance.now()/1000-t0:tPause;
function play(){t0=performance.now()/1000-tPause;playing=true;document.body.classList.remove('paused');$('play').textContent='Pausieren'}
function pause(){tPause=now()%LEN;playing=false;document.body.classList.add('paused');$('play').textContent='Abspielen'}
const toggle=()=>playing?pause():play();
$('play').onclick=e=>{e.stopPropagation();toggle()};$('vp').onclick=toggle;
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();toggle()}});
(function tick(){if(!RENDER)frame(now());requestAnimationFrame(tick)})();
// Export-Schnittstelle: ?__render=1, window.__seek(t)
window.__videoMeta={width:3840,height:2160,duration:LEN,fps:FPS};
window.__seek=async t=>{frame(t);await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)))};
frame(0);
</script>
</body>
</html>
