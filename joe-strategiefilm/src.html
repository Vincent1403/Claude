<title>jö Strategiefilm</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: Player wie die jö Video-Timeline – Bühne 1920×1080 oben, Kapitelleiste, darunter Kapitel und Texte zur Abnahme */
@font-face{font-family:"Satoshi";src:url(data:font/woff2;base64,__FONT__) format("woff2");font-weight:300 900;font-display:block}
:root{
 --page:#efeae2;--panel:#e5dfd5;--line:#cfc7ba;--text:#2a211d;--muted:#6f655c;--accent:#e2550f;--track:#d6cfc4;--chip:#f7f3ed;
 --font:"Satoshi",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
 /* Filmfarben (Markenwerte, in beiden Themes gleich) */
 --burg:#821419;--burg-soft:#9a4a40;--beige:#f6f1ea;--white:#ffffff;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#181513;--panel:#221e1b;--line:#3a332e;--text:#efe8de;--muted:#9e948a;--accent:#f26a22;--track:#332d28;--chip:#2b2622;color-scheme:dark}}
:root[data-theme="dark"]{--page:#181513;--panel:#221e1b;--line:#3a332e;--text:#efe8de;--muted:#9e948a;--accent:#f26a22;--track:#332d28;--chip:#2b2622;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--page);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased}
.wrap{max-width:1280px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;align-items:baseline;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:1.25rem;font-weight:700;margin:0;letter-spacing:-.01em}
header p{margin:0;color:var(--muted);font-size:.9rem}

.viewport{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:10px;background:#000}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;font-family:var(--font);background:#000}
.scene{position:absolute;inset:0;overflow:hidden}
.g-video{background:
  radial-gradient(45% 70% at 0% 100%,#b23336 0%,rgba(178,51,54,0) 100%),
  linear-gradient(95deg,#c4382b 0%,#cf3a25 18%,#db3e22 36%,#de4626 52%,#e05530 68%,#e86a37 84%,#ee793c 96%,#ee793c 100%)}
.g-anim{background:
  radial-gradient(55% 85% at 0% 88%,#8c1d10 0%,rgba(140,29,16,0) 70%),
  radial-gradient(42% 62% at 97% 46%,#fbe2c8 0%,rgba(251,226,200,0) 72%),
  radial-gradient(38% 50% at 84% 104%,#ff8a10 0%,rgba(255,138,16,0) 70%),
  radial-gradient(40% 55% at 10% 0%,#ff7a00 0%,rgba(255,122,0,0) 70%),
  linear-gradient(100deg,#ee6f10 0%,#e8823a 50%,#eea26a 78%,#f1bb8f 100%)}
.mask-oes{-webkit-mask:var(--oes) center/contain no-repeat;mask:var(--oes) center/contain no-repeat}
.mask-logo{-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}
.card{position:absolute;background:rgba(255,255,255,.82);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-radius:26px;padding:24px 28px;color:#821419;box-shadow:0 18px 40px rgba(80,30,0,.16);font-size:28px;font-weight:600;will-change:transform,opacity}
.card .small{font-size:22px;font-weight:500;margin-top:8px;color:#8a3b30}
.card .num{font-size:66px;font-weight:700;letter-spacing:-.02em;line-height:1;display:flex;align-items:center;gap:12px}
.card .row{display:flex;align-items:center;gap:16px}
.card .cta{display:inline-block;margin-top:14px;background:#821419;color:#fff;font-size:20px;font-weight:600;padding:9px 20px;border-radius:99px}
.plogo{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;line-height:1.05;text-align:center}
i.oes{display:inline-block;width:.86em;height:.96em;background:currentColor;-webkit-mask:var(--oes) center/contain no-repeat;mask:var(--oes) center/contain no-repeat}
.jo-badge{width:64px;height:64px;border-radius:50%;background:linear-gradient(140deg,#f2801f,#d9503a);position:relative;flex:none}
.dots{display:grid;grid-template-columns:repeat(6,42px);gap:10px;margin-top:16px}
.dots b{width:42px;height:42px;border-radius:50%;background:#fff;border:2px solid #f1e6dc;display:grid;place-items:center;font-size:16px;font-weight:700;color:#821419}
.dots b.f{background:linear-gradient(140deg,#f7931e,#e0532b);border:0;color:#fff}
.tile2{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;border-radius:18px;will-change:transform,opacity}
.tx .u{display:inline-block;will-change:transform}
.tx .hi{background:linear-gradient(95deg,#e9670f 0%,#f07816 55%,#f1a066 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.tile{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;border-radius:18px;will-change:transform,opacity}
.lbl{position:absolute;left:66px;width:180px;font-size:18px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#a07a70}
.pill{display:inline-block;padding:16px 38px;border-radius:99px;font-size:42px;font-weight:800;letter-spacing:-.01em;will-change:transform,opacity}
#black{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}

.controls{display:flex;align-items:center;gap:10px 14px;margin-top:14px;flex-wrap:wrap}
.btn{appearance:none;border:0;background:var(--accent);color:#fff;width:46px;height:46px;border-radius:50%;cursor:pointer;display:grid;place-items:center;flex:none}
.btn svg{width:18px;height:18px}
.tc{font-variant-numeric:tabular-nums;font-weight:600;font-size:.95rem;min-width:110px}
.now{color:var(--muted);font-size:.95rem;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex:1;min-width:0}
.chip{appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--text);font:600 .82rem var(--font);padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--text);color:var(--page);border-color:var(--text)}
.btn:focus-visible,.chip:focus-visible,.chap:focus-visible,.track:focus-visible{outline:3px solid var(--text);outline-offset:2px}
.track{position:relative;height:44px;margin-top:12px;border-radius:8px;background:var(--track);cursor:pointer;touch-action:none;overflow:hidden}
.seg{position:absolute;top:0;bottom:0;border-right:2px solid var(--page);display:flex;align-items:center;padding:0 8px;font-size:.74rem;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.fill{position:absolute;left:0;top:0;bottom:0;background:rgba(226,85,15,.22);pointer-events:none}
.head{position:absolute;top:0;bottom:0;width:3px;margin-left:-1px;background:var(--accent);pointer-events:none}
.hint{color:var(--muted);font-size:.8rem;margin:8px 0 0}
.below{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.4fr);gap:20px;margin-top:22px}
@media (max-width:760px){.below{grid-template-columns:1fr}}
.chaps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.chap{width:100%;text-align:left;appearance:none;border:0;background:transparent;color:var(--text);font:500 .95rem var(--font);padding:10px 12px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.chap:hover{background:var(--panel)}
.chap[aria-current="true"]{background:var(--panel);font-weight:700}
.chap small{color:var(--muted);font-variant-numeric:tabular-nums;font-weight:500}
.notes{background:var(--panel);border-radius:10px;padding:18px 20px;min-width:0}
.notes h2{font-size:1.05rem;margin:0 0 4px;text-wrap:balance}
.notes .src{color:var(--muted);font-size:.85rem;margin:0 0 12px}
.notes ul{margin:0;padding-left:1.1em;line-height:1.55;font-size:.95rem;max-width:68ch}
.notes li+li{margin-top:4px}

/* Render-Modus für den MP4-Export: nur die Bühne, 1:1 */
:root.render,:root.render body{background:#000;padding:0}
.render .wrap{max-width:none;padding:0}
.render header,.render .controls,.render .track,.render .hint,.render .below{display:none}
.render .viewport{width:1920px;height:1080px;border-radius:0;aspect-ratio:auto}
@media (prefers-reduced-motion:reduce){.chap{transition:none}}
</style>

<div class="wrap">
 <header>
  <h1>jö Markenstrategie · Film für die Partner</h1>
  <p>Entwurf 2 · 1:36 · 1920 × 1080 · 24 fps</p>
 </header>
 <div class="viewport" id="vp"><div id="stage"></div></div>
 <div class="controls">
  <button class="btn" id="play" aria-label="Abspielen"></button>
  <button class="chip" id="toStart">Zum Anfang</button>
  <div class="tc" id="tc">00:00 / 01:36</div>
  <div class="now" id="now"></div>
  <button class="chip" id="mute" aria-pressed="false">Ton aus</button>
 </div>
 <div class="track" id="track" tabindex="0" role="slider" aria-label="Zeitleiste" aria-valuemin="0" aria-valuemax="96" aria-valuenow="0"><div class="fill" id="fill"></div><div id="segs"></div><div class="head" id="head"></div></div>
 <p class="hint">Leertaste: Play/Pause · Pfeiltasten: eine Sekunde vor oder zurück, mit Umschalttaste ein Frame</p>
 <div class="below">
  <ul class="chaps" id="chaps"></ul>
  <div class="notes" id="notes" aria-live="polite"></div>
 </div>
</div>
<audio id="au" preload="auto" src="data:audio/mpeg;base64,__MUSIC__"></audio>

<script>
(function(){
const DATA=__DATA__;
const LP=DATA.LP,b=DATA.BEATS,A=__ANIM__;
const $=id=>document.getElementById(id);
const FPS=24,END=96,BT=.5725,BAR=i=>b[i*4];
const clamp=(v,a=0,c=1)=>Math.min(c,Math.max(a,v)),seg=(t,a,c)=>clamp((t-a)/(c-a));
const eIO=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const eExpo=p=>p>=1?1:1-Math.pow(2,-10*p);
const eInCub=p=>p*p*p;
const eOut=p=>1-Math.pow(1-p,3);
const eBack=p=>{const c1=1.5,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2)};
const BURG='#821419',WHITE='#fff';
const stage=$('stage');
document.documentElement.style.setProperty('--oes',`url(${A.oes})`);document.documentElement.style.setProperty('--logo',`url(${A.logo})`);

/* ---------- Text: Wörter oder Buchstaben steigen aus Zeilenmasken (wie im Markenfilm) ---------- */
function TX(parent,o){
  const size=o.size,lh=Math.round(size*1.2),box=Math.round(size*1.3);
  const el=document.createElement('div');el.className='tx';
  const left=o.x!=null;
  el.style.cssText=`position:absolute;left:${left?o.x:0}px;${left?'':'right:0;'}top:${(o.y-o.lines.length*box/2).toFixed(1)}px;text-align:${left?'left':'center'};color:${o.color};font-size:${size}px;font-weight:${o.weight||900};letter-spacing:${o.ls??-.02}em;line-height:${lh}px;transform-origin:${left?'0% 50%':'50% 50%'};${o.opacity?`opacity:${o.opacity};`:''}`;
  const units=[];
  o.lines.forEach(line=>{
    const L=document.createElement('div');L.style.cssText=`height:${box}px;overflow:hidden;white-space:pre;padding:${Math.round(size*.04)}px .12em 0`;
    line.split(' ').forEach((w,wi)=>{
      if(wi)L.append(' ');
      const hi=w.startsWith('*');w=w.replace(/^\*/,'');
      if(o.mode==='letters'){const ws=document.createElement('span');ws.style.display='inline-block';[...w].forEach(c=>{const s=document.createElement('span');s.className='u';s.textContent=c;ws.append(s);units.push(s)});L.append(ws)}
      else{const s=document.createElement('span');s.className='u'+(hi?' hi':'');s.textContent=w;L.append(s);units.push(s)}
    });
    el.append(L);
  });
  parent.append(el);
  return {el,units,
    render(t,a){const dur=a.dur??.55,os=a.os??.025,od=a.od??.3;
      units.forEach((u,i)=>{const s=a.times?a.times[Math.min(i,a.times.length-1)]+(i>=a.times.length?(i-a.times.length+1)*(a.step||.1):0):a.at+i*(a.step||0);
        const p=eExpo(seg(t,s,s+dur)),q=a.out!=null?eInCub(seg(t,a.out+i*os,a.out+i*os+od)):0;
        u.style.transform=`translateY(${((1-p)*112+q*112).toFixed(2)}%)`;
        if(a.blur)u.style.filter=`blur(${((1-p)*a.blur+q*a.blur*.5).toFixed(2)}px)`;
        if(a.track)u.style.marginRight=((1-p)*a.track).toFixed(3)+'em';
      });
      if(a.grow){const g=a.grow;el.style.transform=`scale(${(1+g[2]*eOut(seg(t,g[0],g[1]))).toFixed(4)})`}
    }};
}

/* ---------- jö-Logo: Striche zeichnen sich, drei Punkte springen und landen (Werte aus der Logo-Animation) ---------- */
const LOGO_H=182.86,LOGO_W=271.15,L_PRE=.4;
const LM=(()=>{const P={hop:.124,n:3,el:.42,st:.083,sq:.16},H=P.hop*LOGO_H,RISE=.30,FALL=.16,bounces=[];let t=RISE+FALL;
  for(let i=1;i<=P.n;i++){const r=Math.pow(P.el,i),T=2*FALL*Math.sqrt(r);bounces.push({t0:t,T,h:H*r});t+=T}
  return {P,J:[0,.45],R:[.03,.58],B:[.56,.86],POP:.47,H,RISE,FALL,bounces}})();
function dotState(M,tt){
  if(tt<0)return {y:0,s:0,sx:1,sy:1};
  const s=eBack(seg(tt,0,.14));let y=0;
  if(tt<M.RISE){const p=tt/M.RISE;y=-M.H*(1-(1-p)*(1-p))}
  else if(tt<M.RISE+M.FALL){const p=(tt-M.RISE)/M.FALL;y=-M.H*(1-p*p)}
  else{const q=M.bounces.find(q=>tt<q.t0+q.T);if(q){const r=(tt-q.t0)/q.T;y=-q.h*4*r*(1-r)}}
  let k=0;[{t:M.RISE+M.FALL,h:M.H},...M.bounces.map(q=>({t:q.t0+q.T,h:q.h}))].forEach(l=>{const d=tt-l.t;if(d>=0&&d<.16)k=Math.max(k,Math.sqrt(l.h/M.H)*Math.exp(-d/.045))});
  return {y,s,sx:1+M.P.sq*.75*k,sy:1-M.P.sq*k};
}
let logoN=0;
function LOGO(parent,cx,cy,sc){
  const id='l'+(++logoN),NS='http://www.w3.org/2000/svg',svg=document.createElementNS(NS,'svg');
  svg.setAttribute('viewBox','-10 -60 291 253');
  Object.assign(svg.style,{position:'absolute',overflow:'visible',left:(cx-(10+LOGO_W/2)*sc)+'px',top:(cy-(60+LOGO_H/2)*sc)+'px',width:291*sc+'px',height:253*sc+'px'});
  svg.innerHTML=`<defs>
<mask id="${id}J" maskUnits="userSpaceOnUse" x="-20" y="-80" width="320" height="290"><path class="sJ" d="${LP.JC}" fill="none" stroke="#fff" stroke-width="30"/></mask>
<mask id="${id}B" maskUnits="userSpaceOnUse" x="-20" y="-80" width="320" height="290"><path class="sB" d="${LP.BC}" fill="none" stroke="#fff" stroke-width="34" stroke-linecap="round"/></mask>
<mask id="${id}C" maskUnits="userSpaceOnUse" x="-20" y="-80" width="320" height="290"><rect x="-20" y="-80" width="320" height="290" fill="#fff"/><path class="cut" d="${LP.CUT}" fill="#000" fill-opacity="0"/><path d="${LP.E}" fill="#fff"/></mask></defs>
<path d="${LP.J}" fill="#fff" mask="url(#${id}J)"/>
<path class="sR" d="${LP.RC2}" fill="none" stroke="#fff" stroke-width="22.79" mask="url(#${id}C)"/>
<path d="${LP.E}" fill="#fff" mask="url(#${id}B)"/>
<circle cx="87.99" cy="16.8" r="16.8" fill="#fff"/><circle cx="152.94" cy="16.8" r="16.8" fill="#fff"/><circle cx="207.17" cy="16.8" r="16.8" fill="#fff"/>`;
  parent.append(svg);
  const S={J:svg.querySelector('.sJ'),R:svg.querySelector('.sR'),B:svg.querySelector('.sB')};
  for(const k in S){const L=LP.LEN[k==='R'?'RC2':k+'C']+2;S[k].setAttribute('stroke-dasharray',L+' '+L);S[k]._L=L}
  const dots=[...svg.querySelectorAll('circle')],cut=svg.querySelector('.cut');
  const set=(k,p)=>{p=clamp(p);S[k].setAttribute('stroke-dashoffset',(S[k]._L*(1-p)).toFixed(2));S[k].style.visibility=p<=0?'hidden':'visible'};
  return {svg,render(t){const u=t-L_PRE,M=LM;
    set('J',eIO(seg(u,...M.J)));set('R',eIO(seg(u,...M.R)));
    const bp=eIO(seg(u,...M.B));set('B',bp);cut.setAttribute('fill-opacity',seg(bp,.64,.70).toFixed(3));
    dots.forEach((c,i)=>{const d=dotState(M,u-M.POP-i*M.P.st),x=+c.getAttribute('cx');
      c.setAttribute('transform',`translate(${x} ${33.6+d.y}) scale(${d.s*d.sx} ${d.s*d.sy}) translate(${-x} -33.6)`)})}};
}

/* ---------- Kacheln mit Overshoot ---------- */
function tileIn(el,t,a,dy=40){const p=eBack(seg(t,a,a+.45)),o=seg(t,a,a+.18);el.style.opacity=o.toFixed(3);el.style.transform=`translateY(${((1-p)*dy).toFixed(1)}px) scale(${(.92+.08*p).toFixed(4)})`}
function div(parent,css,html,cls){const d=document.createElement('div');if(cls)d.className=cls;d.style.cssText=css;if(html!=null)d.innerHTML=html;parent.append(d);return d}

/* ---------- Szenen ---------- */
const SC=[];
function scene(o){const L=div(stage,'','',o.cls?'scene '+o.cls:'scene');if(o.bg)L.style.background=o.bg;o.L=L;o.build(L);SC.push(o);return o}
const BG={grad:{cls:'g-anim',fg:WHITE,lab:'rgba(255,255,255,.85)'},beige:{bg:'#f6f1ea',fg:BURG,lab:'#9a4a40'},white:{bg:'#ffffff',fg:BURG,lab:'#9a4a40'},burg:{bg:'#821419',fg:WHITE,lab:'rgba(255,255,255,.75)'}};
const oesI='<i class="oes"></i>';

/* Headline-Karte im Stil des alten Reels: eine Aussage, bildfüllend, harter Schnitt auf den Takt */
function H(o){const k=BG[o.bg];return scene({name:o.name,start:o.start,wipe:o.wipe,cls:k.cls,bg:k.bg,src:o.src,copy:[...(o.label?[o.label]:[]),o.lines.join(' ').replace(/\*/g,'')],
  build(L){const n=o.lines.length,size=o.size||150,box=Math.round(size*1.3);
    if(o.label)this.l=TX(L,{lines:[o.label],size:42,color:k.lab,y:540-n*box/2-46,weight:700,ls:0,mode:'letters'});
    this.m=TX(L,{lines:o.lines,size,color:k.fg,y:540+(o.label?14:0),mode:o.mode});
    if(k.fg===WHITE)this.m.el.style.textShadow='0 6px 40px rgba(120,40,0,.18)'},
  render(t){const end=o.end-.3;
    if(this.l)this.l.render(t,{at:o.start+.05,step:.02,dur:.7,blur:8,out:end,os:.006});
    this.m.render(t,o.times?{times:o.times,dur:.6,out:end,os:.03,grow:[o.start,o.end,.03]}:{at:o.start+(o.label?.25:.08),step:o.step??BT/2,dur:o.mode==='letters'?.9:.55,blur:o.mode==='letters'?12:0,track:o.mode==='letters'?.08:0,out:end,os:o.mode==='letters'?.01:.025,grow:[o.start,o.end,.03]})}})}

/* Figur im Ös wie in der Animatic: Ös, Foto, zwei Glas-Karten, Satz unten links */
function FIG(o){const k=BG[o.bg];return scene({name:o.name,start:o.start,cls:k.cls,bg:k.bg,src:o.src,copy:[o.label,...o.cardText],
  build(L){this.oes=div(L,`position:absolute;left:600px;top:150px;width:720px;height:806px;background:${o.bg==='grad'?'#fff':'linear-gradient(140deg,#f2801f 10%,#e36a3a 60%,#f0a066 100%)'};transform-origin:50% 55%`,'','mask-oes');
    this.ph=div(L,`position:absolute;left:735px;top:232px;width:440px;height:661px;border-radius:44px;background:url(${o.img}) center/cover;box-shadow:0 30px 60px rgba(60,20,0,.25)`);
    this.cards=o.cards.map(c=>div(L,`left:${c.x}px;top:${c.y}px`,c.html,'card'));
    this.lab=TX(L,{lines:[o.label],size:96,color:k.fg,x:96,y:930})},
  render(t){const s=o.start,e=o.end;
    const p=eBack(seg(t,s,s+.55));this.oes.style.transform=`scale(${(.6+.4*p+.03*eOut(seg(t,s,e))).toFixed(4)})`;this.oes.style.opacity=seg(t,s,s+.12).toFixed(3);
    tileIn(this.ph,t,s+.18,60);
    this.cards.forEach((c,i)=>{tileIn(c,t,s+BT*(1+i),24);c.style.transform+=` translateY(${(-14*eOut(seg(t,s,e))).toFixed(1)}px)`});
    this.lab.render(t,{at:s+.25,step:BT/2,out:e-.3})}})}

// 1 Logo
scene({name:'Logo',start:0,cls:'g-anim',src:'Logo-Reveal wie in der Animatic',copy:['jö Logo'],
  build(L){this.g=div(L,'position:absolute;inset:0;transform-origin:50% 50%');this.logo=LOGO(this.g,960,540,2.8)},
  render(t){this.logo.render(t-1.0);this.g.style.transform=`scale(${(1+.05*eIO(seg(t,0,9.2))).toFixed(4)})`}});

    this.ic.style.opacity=seg(t,m+.2,m+.3).toFixed(3);this.ic.style.transform=`translateX(${(-300*sl).toFixed(1)}px) scale(${(.4+.6*ip).toFixed(4)})`;

/* ---------- Abspielen ---------- */
function vEnd(i){const n=SC[i+1];return n?n.start+(n.wipe||0):END+1}
let T=0;
function render(t){T=clamp(t,0,END);
  SC.forEach((s,i)=>{const on=T>=s.start&&T<vEnd(i);s.L.hidden=!on;if(!on)return;
    if(s.wipe){const e=eIO(seg(T,s.start,s.start+s.wipe));s.L.style.clipPath=e<1?`inset(${((1-e)*100).toFixed(3)}% 0 0 0)`:''}
    s.render(T)});
  ui()}
window.seek=t=>{render(t)};
window.FILM={END,FPS,chapters:SC.map(s=>[s.start,s.name])};

const vp=$('vp'),au=$('au'),play=$('play');
const isRender=location.hash==='#render';
if(isRender)document.documentElement.classList.add('render');
const fit=()=>{stage.style.transform=isRender?'':`scale(${vp.clientWidth/1920})`};
new ResizeObserver(fit).observe(vp);fit();

const ICON_PLAY='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z" fill="currentColor"/></svg>',ICON_PAUSE='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z" fill="currentColor"/></svg>';
let playing=false,t0=0,w0=0,raf=0;
const fmt=s=>{s=Math.max(0,s);const m=Math.floor(s/60),x=Math.floor(s%60);return String(m).padStart(2,'0')+':'+String(x).padStart(2,'0')};
function setPlay(on){playing=on;play.innerHTML=on?ICON_PAUSE:ICON_PLAY;play.setAttribute('aria-label',on?'Pause':'Abspielen');
  if(on){if(T>=END-.05)render(0);t0=T;w0=performance.now();au.currentTime=T;au.play().catch(()=>{});raf=requestAnimationFrame(tick)}
  else{au.pause();cancelAnimationFrame(raf)}}
function tick(now){let t=t0+(now-w0)/1000;
  if(!au.paused&&!au.muted&&Math.abs(au.currentTime-t)<.25)t=au.currentTime; else if(!au.paused&&Math.abs(au.currentTime-t)>=.25)au.currentTime=t;
  if(t>=END){render(END);setPlay(false);return}
  render(t);raf=requestAnimationFrame(tick)}
function jump(t){render(t);if(playing){t0=T;w0=performance.now();au.currentTime=T}}
play.onclick=()=>setPlay(!playing);
$('toStart').onclick=()=>jump(0);
const mute=$('mute');mute.onclick=()=>{au.muted=!au.muted;mute.setAttribute('aria-pressed',String(au.muted));mute.textContent=au.muted?'Ton an':'Ton aus'};

const track=$('track'),segs=$('segs'),chaps=$('chaps'),notes=$('notes');
SC.forEach((s,i)=>{const e=i<SC.length-1?SC[i+1].start:END;
  const d=document.createElement('div');d.className='seg';d.style.left=(s.start/END*100)+'%';d.style.width=((e-s.start)/END*100)+'%';d.textContent=s.name;segs.append(d);
  const li=document.createElement('li'),btn=document.createElement('button');btn.className='chap';btn.innerHTML=`<span>${i+1}. ${s.name}</span><small>${fmt(s.start)}</small>`;btn.onclick=()=>jump(s.start+(s.wipe||0)+.01);li.append(btn);chaps.append(li)});
const esc=x=>String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let curI=-1;
function ui(){$('tc').textContent=fmt(T)+' / '+fmt(END);
  const p=T/END*100;$('fill').style.width=p+'%';$('head').style.left=p+'%';track.setAttribute('aria-valuenow',Math.round(T));
  let ci=0;SC.forEach((s,i)=>{if(T>=s.start)ci=i});
  if(ci!==curI){curI=ci;const s=SC[ci];$('now').textContent=s.name;
    [...chaps.querySelectorAll('.chap')].forEach((c,i)=>c.setAttribute('aria-current',String(i===ci)));
    notes.innerHTML=`<h2>${ci+1}. ${esc(s.name)}</h2><p class="src">Quelle: ${esc(s.src)}</p><ul>${s.copy.map(c=>`<li>${esc(c)}</li>`).join('')}</ul>`}}
const scrub=e=>{const r=track.getBoundingClientRect();jump(clamp((e.clientX-r.left)/r.width)*END)};
track.addEventListener('pointerdown',e=>{track.setPointerCapture(e.pointerId);scrub(e);track.onpointermove=scrub});
track.addEventListener('pointerup',()=>{track.onpointermove=null});
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea'))return;
  if(e.code==='Space'){e.preventDefault();setPlay(!playing)}
  else if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();const d=(e.shiftKey?1/FPS:1)*(e.key==='ArrowRight'?1:-1);jump(T+d)}});

setPlay(false);
render(isRender?0:BAR(6)+1.6);
document.fonts.ready.then(()=>{render(T);window.FILM.ready=true});
})();
</script>
