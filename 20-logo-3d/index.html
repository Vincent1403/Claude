<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>20 Logo 3D</title>
<style>
  html, body { margin: 0; height: 100%; background: #c4c4c4; overflow: hidden; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  #ui { position: fixed; right: 16px; bottom: 16px; display: flex; gap: 8px; }
  #ui button { padding: 8px 12px; border: 0; border-radius: 6px; background: #222; color: #fff; cursor: pointer; font-size: 13px; }
  body.render #ui { display: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="ui">
  <button id="glb">Download GLB</button>
  <button id="stl">Download STL</button>
  <button id="png">Download PNG</button>
</div>
<script type="module">
import * as THREE from 'three';
import { SVGLoader } from 'three/addons/loaders/SVGLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { STLExporter } from 'three/addons/exporters/STLExporter.js';

// Source: 20.svg (viewBox 420.57 x 203.79)
const SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420.57 203.79">
<path d="M316.39.04c-56.01,0-101.41,45.63-101.41,101.91,0,42.97,26.85,81.33,67.12,95.87,8-10.03,14.6-21.14,19.58-33,5.64-13.46,9.18-27.73,10.49-42.28.86-9.45.82-18.96-.13-28.39l-52.6,52.71c-3.65-27.44,15.21-52.78,42.46-56.98v-.21h-66.01c16.73-21.99,47.89-26.5,70.11-10.13.06-.04.11-.09.15-.15l-46.71-46.87c27.56-3.71,52.93,15.62,56.81,43.29h.22c3.88-27.67,29.25-47,56.81-43.29l-46.67,46.91.15.17c22.22-16.38,53.4-11.9,70.13,10.11h-66.05v.21c27.22,4.2,46.09,29.51,42.46,56.94l-50.48-50.67c5.83,24.81,5.73,50.65-.28,75.42-2.7,11.03-6.54,21.76-11.45,32,1.74,0,3.5.13,5.28.13,55.99,1.52,102.62-42.82,104.14-99.09C422.07,48.42,377.9,1.57,321.92.04c-1.84-.06-3.67-.06-5.51,0h-.02Z"/>
<path d="M77.64,149.17l117.37.96v48.91L0,197.97v-13.71c0-11.67,2.35-22.69,6.99-32.76,4.33-9.4,10.76-18.18,19.1-26.08,7.62-7.22,17.06-13.92,28.05-19.92,9.97-5.44,21.54-10.47,34.41-14.97l.12-.04.13-.04c21.11-6.4,50.22-13.19,50.22-22.55,0-2.28-.95-4.27-2.89-6.08-2.62-2.44-6.94-4.37-12.49-5.57-6.96-1.51-15.73-1.9-26.07-1.16-13.5.97-26.8,3.92-39.78,7.93-27.43,8.47-49.76,23.58-49.76,23.58v-53.64l4.05-2.44C40.41,13.47,53.34,5.69,98.11,5.69c16.34,0,30.04,1.11,41.88,3.38,12.33,2.37,22.27,5.93,30.38,10.89,8.36,5.11,14.69,11.78,18.82,19.81,2.04,3.98,3.59,8.38,4.59,13.07.97,4.56,1.47,9.54,1.47,14.81,0,7.06-.12,13.93-1.58,20.34-1.66,7.29-4.96,13.38-10.09,18.61-5.47,5.58-13.26,10.45-23.84,14.88-10.7,4.49-24.57,8.69-42.41,12.84-18.68,4.38-30.25,8.27-36.42,12.26-1.36.88-2.41,1.72-3.27,2.59Z"/>
</svg>`;

const DEPTH = 40;          // extrusion depth in SVG units (logo is ~204 units tall)
const COLOR = 0xc8b4a0;    // bronze

const renderMode = new URLSearchParams(location.search).has('render');
if (renderMode) document.body.classList.add('render');
// Downloads don't work inside an embedded viewer; hide the buttons there.
if (window.self !== window.top) document.getElementById('ui').style.display = 'none';

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(renderMode ? 1 : Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xc4c4c4);

// Studio-ish environment for the metal reflections: warm brown top, dark band, cool blue streaks.
function makeEnv() {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 512;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, 512);
  grad.addColorStop(0.00, '#a4b6d0');
  grad.addColorStop(0.25, '#c49a70');
  grad.addColorStop(0.42, '#b08860');
  grad.addColorStop(0.48, '#6e5642');
  grad.addColorStop(0.52, '#8ea4c4');
  grad.addColorStop(0.56, '#3a3634');
  grad.addColorStop(0.66, '#6c543e');
  grad.addColorStop(1.00, '#2e2620');
  g.fillStyle = grad; g.fillRect(0, 0, 1024, 512);
  // soft light panels
  g.filter = 'blur(18px)';
  g.fillStyle = '#ffe2c0'; g.fillRect(380, 40, 260, 90);
  g.fillStyle = '#b8cdf0'; g.fillRect(80, 230, 200, 40);
  g.fillStyle = '#c9d8f5'; g.fillRect(760, 220, 180, 50);
  const tex = new THREE.CanvasTexture(c);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  const pmrem = new THREE.PMREMGenerator(renderer);
  const env = pmrem.fromEquirectangular(tex).texture;
  tex.dispose(); pmrem.dispose();
  return env;
}
scene.environment = makeEnv();

const key = new THREE.DirectionalLight(0xfff0e0, 1.2);
key.position.set(-1, 2, 3);
scene.add(key);

// Build the extruded logo
const data = new SVGLoader().parse(SVG);
const material = new THREE.MeshStandardMaterial({ color: COLOR, metalness: 1, roughness: 0.2 });
const logo = new THREE.Group();
for (const path of data.paths) {
  for (const shape of SVGLoader.createShapes(path)) {
    const geo = new THREE.ExtrudeGeometry(shape, {
      depth: DEPTH, curveSegments: 24,
      bevelEnabled: true, bevelThickness: 0.6, bevelSize: 0.6, bevelSegments: 2,
    });
    logo.add(new THREE.Mesh(geo, material));
  }
}
logo.scale.set(1, -1, 1); // SVG y points down
// center it
const box = new THREE.Box3().setFromObject(logo);
const center = box.getCenter(new THREE.Vector3());
logo.position.sub(center);
const pivot = new THREE.Group();
pivot.add(logo);
pivot.rotation.set(0.12, 0.62, 0); // turned so the left side faces the camera, like the reference
scene.add(pivot);

const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 1, 5000);
camera.position.set(0, 90, 1250);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(110, 0, 0); // logo sits slightly left of center, like the reference

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

(function loop() {
  requestAnimationFrame(loop);
  controls.update();
  renderer.render(scene, camera);
})();

// Exports (model in its unrotated, centered pose; units = SVG units)
function exportRoot() {
  const root = new THREE.Group();
  const clone = logo.clone();
  root.add(clone);
  root.updateMatrixWorld(true);
  return root;
}
function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
}
window.exportGLB = () => new Promise((res, rej) =>
  new GLTFExporter().parse(exportRoot(), r => res(new Uint8Array(r)), rej, { binary: true }));
window.exportSTL = () => new STLExporter().parse(exportRoot(), { binary: true });
window.ready = true;

document.getElementById('glb').onclick = async () => download(new Blob([await exportGLB()]), '20.glb');
document.getElementById('stl').onclick = () => download(new Blob([exportSTL()]), '20.stl');
document.getElementById('png').onclick = () => renderer.domElement.toBlob(b => download(b, '20.png'));
</script>
</body>
</html>
