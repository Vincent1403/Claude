// All sizes in SVG units (the logo is ~204 units tall).
const BRONZE_DEPTH = 40;   // extrusion of the "20"
const LOGO_SINK = 6;       // how far the "20" sits down into the base (the "0" hangs ~5 below the "2")
const PLEXI_THICK = 8;     // acrylic panel thickness (~5 mm at a 20 cm tall panel)
const PLEXI_MARGIN = 16;   // solid acrylic around the circle (left / right / top)
const PLEXI_RATIO = 918 / 660; // panel height / width, from the sketch
const PLEXI_TINT = 0x44483c; // acrylic tint colour
const PLEXI_SINK = 10;     // panel slotted into the base
const BASE_H = 70;         // base height
const BASE_PAD = 25;       // base overhang beyond the piece, left/right
const BASE_D = 120;        // base depth (front to back)
const TOPO_W = 200;        // topo block: face width (height follows the pattern crop, ~456)
const TOPO_D = 80;         // topo block depth, front to back
const TOPO_STEP = 7;       // depth of each carved terrace (and of the engravings)
// Certificate: the same carving on a thin A4 board, in millimetres
const TOPO_DEEPEST = 0x7a4a2a; // wood tint at the deepest terrace (surface = natural wood)
const CERT_W = 210;        // A4 width (height 297 follows the 1 : 1.414 crop)
const CERT_D = 10;         // board thickness

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(renderMode ? 1 : Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xc4c4c4);

// Studio-ish environment for reflections: warm top, dark band, cool blue streaks.
function makeEnv() {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 512;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, 512);
  grad.addColorStop(0.00, '#a4b6d0');
  grad.addColorStop(0.25, '#c49a70');
  grad.addColorStop(0.42, '#b08860');
  grad.addColorStop(0.48, '#6e5642');
  grad.addColorStop(0.52, '#8ea4c4');
  grad.addColorStop(0.56, '#3a3634');
  grad.addColorStop(0.66, '#6c543e');
  grad.addColorStop(1.00, '#2e2620');
  g.fillStyle = grad; g.fillRect(0, 0, 1024, 512);
  g.filter = 'blur(18px)';
  g.fillStyle = '#ffe2c0'; g.fillRect(380, 40, 260, 90);
  g.fillStyle = '#b8cdf0'; g.fillRect(80, 230, 200, 40);
  g.fillStyle = '#c9d8f5'; g.fillRect(760, 220, 180, 50);
  const tex = new THREE.CanvasTexture(c);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  const pmrem = new THREE.PMREMGenerator(renderer);
  const env = pmrem.fromEquirectangular(tex).texture;
  tex.dispose(); pmrem.dispose();
  return env;
}
scene.environment = makeEnv();
const key = new THREE.DirectionalLight(0xfff0e0, 1.2);
key.position.set(-100, 200, 300); // same direction as before; distance only matters for shadows
key.castShadow = true;            // only the topo block casts / receives shadows (terraces read better)
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -350, right: 350, top: 350, bottom: -350, near: 1, far: 1500 });
key.shadow.bias = -0.0004; key.shadow.normalBias = 0.6;
scene.add(key);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

// ---- materials ----
const bronze = new THREE.MeshStandardMaterial({ color: 0xc8b4a0, metalness: 1, roughness: 0.2 });
const acrylic = new THREE.MeshPhysicalMaterial({
  color: 0xffffff, metalness: 0, roughness: 0, transmission: 1, thickness: PLEXI_THICK,
  // Tinted acrylic: light passing through the panel's thickness is filtered by PLEXI_TINT,
  // so the face reads as roughly #44483c against the grey backdrop and edges go darker.
  ior: 1.49, attenuationColor: new THREE.Color(PLEXI_TINT), attenuationDistance: PLEXI_THICK * 1.375, // keeps the face at ~#44483c for any thickness
  specularIntensity: 0.6,
});
const baseMat = new THREE.MeshPhysicalMaterial({ color: 0x141414, roughness: 0.3, clearcoat: 1, clearcoatRoughness: 0.08 });

// ---- geometry helpers ----
const svgPaths = new SVGLoader().parse(SVG).paths; // [0] = "0" with palm, [1] = "2"
const extrude = (shape, depth) => {
  const geo = new THREE.ExtrudeGeometry(shape, { depth, curveSegments: 64, bevelEnabled: false });
  geo.translate(0, 0, -depth / 2); // centered front-to-back
  // Smooth the curved walls, keep real corners (> 30°) and face/wall edges crisp.
  return toCreasedNormals(geo, THREE.MathUtils.degToRad(30));
};
const zeroShapes = SVGLoader.createShapes(svgPaths[0]);
const zeroBox = new THREE.Box2();
zeroShapes.forEach(s => s.getPoints(64).forEach(p => zeroBox.expandByPoint(p)));

function makeBase(width) {
  const geo = new RoundedBoxGeometry(width, BASE_H, BASE_D, 3, 3);
  const m = new THREE.Mesh(geo, baseMat);
  m.position.y = -BASE_H / 2; // top of the base at y = 0
  m.name = 'base';
  return m;
}

// Version 1: bronze "20" set into the base
function buildBronze() {
  const piece = new THREE.Group();
  for (const p of svgPaths) for (const s of SVGLoader.createShapes(p)) piece.add(new THREE.Mesh(extrude(s, BRONZE_DEPTH), bronze));
  const b = new THREE.Box3().setFromObject(piece);
  piece.position.set(-(b.min.x + b.max.x) / 2, -b.min.y - LOGO_SINK, 0);
  piece.name = 'logo';
  const g = new THREE.Group();
  g.add(piece, makeBase(b.max.x - b.min.x + 2 * BASE_PAD));
  return g;
}

// Version 2: acrylic panel; the "0" outline (disc minus palm) is cut out, the palm stays solid
function buildPlexi() {
  const x0 = zeroBox.min.x - PLEXI_MARGIN, x1 = zeroBox.max.x + PLEXI_MARGIN;
  const y1 = zeroBox.max.y + PLEXI_MARGIN, y0 = y1 - (x1 - x0) * PLEXI_RATIO;
  const panel = new THREE.Shape().moveTo(x0, y0).lineTo(x1, y0).lineTo(x1, y1).lineTo(x0, y1).closePath();
  panel.holes.push(...zeroShapes);
  const mesh = new THREE.Mesh(extrude(panel, PLEXI_THICK), acrylic);
  mesh.position.set(-(x0 + x1) / 2, -y0 - PLEXI_SINK, 0);
  mesh.name = 'panel';
  const g = new THREE.Group();
  g.add(mesh, makeBase(x1 - x0 + 2 * BASE_PAD));
  window.plexiOutline = { x0, x1, y0, y1 };
  return g;
}

function woodTexture({ w, h }) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 1024;
  const g = c.getContext('2d');
  g.fillStyle = '#d8ab72'; g.fillRect(0, 0, 512, 1024);
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 320; i++) {                 // fine, slightly wavy vertical grain
    const x = rnd() * 512, dark = rnd() < 0.6;
    g.strokeStyle = dark ? `rgba(125,72,30,${0.03 + rnd() * 0.09})` : `rgba(255,228,185,${0.03 + rnd() * 0.08})`;
    g.lineWidth = 0.5 + rnd() * 1.5;
    const amp = 1 + rnd() * 5, ph = rnd() * 6.28;
    g.beginPath();
    for (let y = 0; y <= 1024; y += 16) {
      const xx = x + Math.sin(y / 1024 * 6.28 * 2 + ph) * amp;
      y ? g.lineTo(xx, y) : g.moveTo(xx, y);

  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;

  generateSideWallUV: (geo, v, a, b, c, d) => [a, b, c, d].map(i => new THREE.Vector2(v[i * 3] + v[i * 3 + 2], v[i * 3 + 1])),

const versions = {
  bronze: buildBronze(), plexi: buildPlexi(),
  topo: buildTopo(TOPO, TOPO_W, TOPO_D, TOPO_STEP),
  cert: buildTopo(CERT, CERT_W, CERT_D, CERT_STEP),
};
let current = null;

const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 5, 10000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

function frame(obj, elevation = 0.32, side = -0.55) {
  const sphere = new THREE.Box3().setFromObject(obj).getBoundingSphere(new THREE.Sphere());
  const vfov = THREE.MathUtils.degToRad(camera.fov);
  const fit = Math.min(vfov, 2 * Math.atan(Math.tan(vfov / 2) * camera.aspect));
  const dist = sphere.radius / Math.sin(fit / 2) * 1.05;
  const dir = new THREE.Vector3(side, elevation, 1).normalize(); // front-left, above
  controls.target.copy(sphere.center);
  camera.position.copy(sphere.center).addScaledVector(dir, dist);
  controls.update();
}
// Fit the key light's shadow map to the piece on show, so small pieces get sharp shadows.
const keyDir = key.position.clone().normalize();
scene.add(key.target);
function fitShadow(obj) {
  const sp = new THREE.Box3().setFromObject(obj).getBoundingSphere(new THREE.Sphere());
  key.target.position.copy(sp.center);
  key.position.copy(sp.center).addScaledVector(keyDir, sp.radius * 2);
  Object.assign(key.shadow.camera, { left: -sp.radius, right: sp.radius, top: sp.radius, bottom: -sp.radius, near: sp.radius * 0.5, far: sp.radius * 3.5 });
  key.shadow.camera.updateProjectionMatrix();
  key.shadow.normalBias = sp.radius / 600;
}

// Plexiglass only: show / hide the base
const plexiBase = versions.plexi.getObjectByName('base');
const baseBtn = document.getElementById('baseToggle');
function setBase(on) {
  plexiBase.visible = on;
  baseBtn.setAttribute('aria-pressed', String(on));
  baseBtn.textContent = on ? 'Base: on' : 'Base: off';
}
baseBtn.onclick = () => setBase(!plexiBase.visible);
setBase(params.get('base') !== '0');

function setVersion(v) {
  if (!versions[v]) v = 'bronze';
  baseBtn.hidden = v !== 'plexi';
  if (current) scene.remove(current.obj);
  current = { name: v, obj: versions[v] };
  scene.add(current.obj);
  frame(current.obj, v === 'topo' ? 0.2 : v === 'cert' ? 0.12 : 0.32, v === 'cert' ? -0.3 : -0.55);
  fitShadow(current.obj);
  document.querySelectorAll('#versions button[data-v]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === v)));
}
document.querySelectorAll('#versions button[data-v]').forEach(b => b.onclick = () => setVersion(b.dataset.v));
setVersion(params.get('v') || 'bronze');

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

(function loop() {
  requestAnimationFrame(loop);
  controls.update();
  renderer.render(scene, camera);
})();

// ---- exports (units = SVG units, y up, base top at y = 0) ----
function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
}
// Only visible parts are exported (the STL exporter would otherwise include a hidden base).
const exportRoot = () => {
  const root = new THREE.Group();
  current.obj.children.forEach(c => { if (c.visible) root.add(c.clone()); });
  root.updateMatrixWorld(true);
  return root;
};
window.exportGLB = () => new Promise((res, rej) =>
  new GLTFExporter().parse(exportRoot(), r => res(new Uint8Array(r)), rej, { binary: true }));
window.exportSTL = () => new STLExporter().parse(exportRoot(), { binary: true });
window.setVersion = setVersion; window.setBase = setBase;
window.camera = camera; window.controls = controls; window.scene = scene;
window.ready = true;

const fileBase = () => current.name === 'plexi'
  ? (plexiBase.visible ? 'trophy-plexiglass' : 'trophy-plexiglass-nobase')
  : 'trophy-' + current.name;
document.getElementById('glb').onclick = async () => download(new Blob([await exportGLB()]), fileBase() + '.glb');
document.getElementById('stl').onclick = () => download(new Blob([exportSTL()]), fileBase() + '.stl');
document.getElementById('png').onclick = () => renderer.domElement.toBlob(b => download(b, fileBase() + '.png'));
</script>
</body>
</html>
